<div class="max-w-4xl mx-auto p-6 bg-white shadow-md rounded-lg">
  <h2 class="text-2xl font-semibold text-gray-800 mb-6">Tu Carrito de Compras</h2>

  <div *ngIf="cartItems.length === 0" class="text-center text-gray-500">
    <p>No tienes productos en tu carrito.</p>
  </div>

  <div *ngFor="let item of cartItems" class="flex items-center justify-between border-b py-4">
    <div class="flex items-center">
      <img [src]="item.product.image_url" alt="{{ item.product.name }}" class="w-16 h-16 object-cover rounded-md mr-4">
      <div>
        <h3 class="text-lg font-medium text-gray-700">{{ item.product.name }}</h3>
        <p class="text-gray-500">Precio Unitario: Q{{ item.product.price }}</p>
      </div>
    </div>

    <div class="flex items-center">
      <button (click)="decreaseQuantity(item)" class="text-gray-600 hover:text-gray-900">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path d="M5 10h10a1 1 0 100-2H5a1 1 0 100 2z" />
        </svg>
      </button>
      <input type="number" [(ngModel)]="item.quantity" class="w-16 mx-2 text-center border rounded-lg outline-none focus:ring-2 focus:ring-blue-500" min="1" (ngModelChange)="updateQuantity(item)" />
      <button (click)="increaseQuantity(item)" class="text-gray-600 hover:text-gray-900">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 01-2 0v-3H7a1 1 0 110-2h3V6a1 1 0 011-1z" />
        </svg>
      </button>
      <button (click)="removeFromCart(item)" class="ml-4 text-red-600 hover:text-red-800">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path d="M6 2a1 1 0 00-1 1v1H2a1 1 0 100 2h1l1 12a1 1 0 001 1h10a1 1 0 001-1l1-12h1a1 1 0 100-2h-1V3a1 1 0 00-1-1H6zm1 3h6l-1 11H7L7 5z" />
        </svg>
      </button>
    </div>
  </div>

  <div class="flex justify-between items-center mt-6">
    <h3 class="text-xl font-semibold text-gray-800">Total: Q{{ calculateTotal() }}</h3>
    <button (click)="checkout()" class="bg-blue-500 text-white py-2 px-4 rounded-lg shadow-md hover:bg-blue-600 transition duration-200">
      Proceder al Pago
    </button>
   </div>
</div>

<!-- Modal de Pago -->
<div *ngIf="isCheckoutModalVisible" class="fixed inset-0 flex items-center justify-center bg-gray-700 bg-opacity-75 z-50">
  <div class="bg-white p-6 rounded-lg shadow-lg max-w-md w-full">
    <h2 class="text-2xl font-semibold mb-4">Confirmación de Pago</h2>
    <p class="mb-4">Total: Q{{ calculateTotal() }}</p>
    <label class="block mb-2">Selecciona un método de pago:</label>
    <select [(ngModel)]="selectedPaymentMethod" class="w-full p-2 border rounded">
      <option value="PAYPAL">PayPal (+10 Tax)</option>
      <option value="PAYMENT_GATEWAY">Payment Gateway (+5 Tax)</option>
    </select>
    <div class="flex justify-between mt-6">
      <button (click)="confirmPayment()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Pagar</button>
      <button (click)="cancelCheckout()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Cancelar</button>
    </div>
  </div>
</div>
