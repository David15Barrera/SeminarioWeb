<div class="max-w-4xl mx-auto p-6 bg-white rounded-lg shadow-lg flex flex-col md:flex-row md:items-center">
    <div class="flex-shrink-0 mb-4 md:mb-0">
      <img [src]="product?.image_url" alt="{{ product?.name }}" class="w-full h-80 object-cover rounded-lg shadow-md border border-gray-200">
    </div>
    
    <div class="md:ml-8 flex-grow">
      <h1 class="text-3xl font-semibold text-gray-800 mb-3">{{ product?.name }}</h1>
      
      <p class="text-gray-600 mb-2"><strong>Descripción:</strong> {{ product?.description }}</p>
      <p class="text-lg text-gray-800 mb-4"><strong>Precio:</strong> <span class="text-blue-600 font-bold">Q{{ product?.price }}</span></p>
      <p class="text-gray-600 mb-4"><strong>Cantidad disponible:</strong> <span class="font-bold">{{ product?.available_quantity }}</span></p>
  
      <div class="mb-4">
        <label for="quantity" class="block text-gray-700 mb-1 font-medium">Cantidad:</label>
        <input type="number" id="quantity" [(ngModel)]="quantity" min="1" max="{{ product?.available_quantity }}" class="border border-gray-300 rounded-md p-2 w-full focus:ring-2 focus:ring-blue-500 transition duration-200" />
      </div>
  
      <button (click)="addToCart()" class="w-full bg-blue-600 text-white font-bold py-2 rounded-md hover:bg-blue-700 transition duration-200">
        Agregar al carrito
      </button>
  
      <div class="mt-6">
        <h2 class="text-xl font-bold mb-2">Categorías asociadas:</h2>
        <div class="flex flex-wrap gap-2">
          <span *ngFor="let category of categories" class="bg-blue-100 text-blue-600 px-3 py-1 rounded-full font-medium">
            {{ category }}
          </span>
        </div>
      </div>
    </div>
  </div>
