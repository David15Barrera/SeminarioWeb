<div class="container mx-auto p-4">
    <h2 class="text-3xl font-semibold mb-6 text-gray-800 text-center">Información de la Tienda</h2>

    <div *ngIf="isLoading" class="text-center mb-4">
        <p class="text-lg text-gray-600">Cargando información de la tienda...</p>
    </div>

    <div *ngIf="!isLoading && store" class="bg-white p-8 rounded-lg shadow-lg transition duration-300 ease-in-out hover:shadow-xl">
        <form (ngSubmit)="updateStore()">
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-semibold mb-2" for="name">Nombre:</label>
                <input 
                    [(ngModel)]="store.name" 
                    name="name" 
                    type="text" 
                    class="shadow-sm border border-gray-300 rounded-md w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-400" 
                    required 
                />
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-semibold mb-2" for="description">Descripción:</label>
                <textarea 
                    [(ngModel)]="store.description" 
                    name="description" 
                    class="shadow-sm border border-gray-300 rounded-md w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-400" 
                    rows="4"
                ></textarea>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-semibold mb-2" for="address">Dirección:</label>
                <input 
                    [(ngModel)]="store.address" 
                    name="address" 
                    type="text" 
                    class="shadow-sm border border-gray-300 rounded-md w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-400" 
                    required 
                />
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-semibold mb-2" for="phone">Teléfono:</label>
                <input 
                    [(ngModel)]="store.phone" 
                    name="phone" 
                    type="text" 
                    class="shadow-sm border border-gray-300 rounded-md w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-400" 
                />
            </div>

            <button 
                type="submit" 
                class="w-full mt-4 bg-blue-600 text-white py-3 rounded-md hover:bg-blue-700 transition duration-200"
            >
                Actualizar Información
            </button>
        </form>
    </div>

    <div *ngIf="!isLoading && !store" class="text-center mt-4">
        <p class="text-lg text-gray-600">No se encontró información de la tienda.</p>
    </div>
</div>
