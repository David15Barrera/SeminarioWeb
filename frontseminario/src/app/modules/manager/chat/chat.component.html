<h2 class="text-3xl font-semibold mb-6 text-gray-900 text-center">Red Social</h2>

<div class="flex flex-col lg:flex-row h-screen bg-white p-4">
  <!-- Panel lateral con lista de temas -->
  <div class="w-full lg:w-1/4 bg-white rounded-lg shadow-md p-4 overflow-auto mb-4 lg:mb-0 border border-black">
    <h2 class="text-lg font-semibold mb-4 text-gray-800">Temas de Publicaciones</h2>
    <ul>
      <li class="p-2 rounded-lg hover:bg-blue-200 cursor-pointer text-gray-800 mb-2">Relajacion</li>
      <li class="p-2 rounded-lg hover:bg-blue-200 cursor-pointer text-gray-800 mb-2">Comida</li>
      <li class="p-2 rounded-lg hover:bg-blue-200 cursor-pointer text-gray-800 mb-2">Horario Libre</li>
    </ul>
  </div>

  <!-- Contenedor principal -->
  <div class="w-full lg:w-3/4 flex flex-col bg-white rounded-lg shadow-md overflow-hidden border border-black">
    <!-- Área de publicaciones -->
    <div class="flex-1 p-6 overflow-auto border-b border-black">
      <h2 class="text-lg font-semibold mb-4 text-gray-800">Publicaciones</h2>
      <form (submit)="createPost()" class="mb-4">
        <textarea [(ngModel)]="newPost" name="newPost" placeholder="Escribe tu publicación..." class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500" rows="3"></textarea>
        <button type="submit" class="mt-2 bg-yellow-600 hover:bg-yellow-700 text-white rounded-lg p-2 shadow-md transition duration-200">
          Publicar
        </button>
      </form>
      <div *ngFor="let post of posts" class="p-4 bg-gray-100 rounded-lg shadow-sm mb-2">
        <p class="font-semibold text-gray-900">{{ post.userName }}</p>
        <p class="text-gray-700">{{ post.content }}</p>
      </div>
    </div>

    <!-- Separador entre publicaciones y chat -->
    <div class="h-4"></div> <!-- Añadir separación -->

    <!-- Botón para abrir/cerrar chat -->
    <button (click)="toggleChat()" class="m-4 bg-blue-600 hover:bg-blue-700 text-white rounded-lg p-2 shadow-md transition duration-200">
      {{ isChatOpen ? 'Cerrar Chat' : 'Abrir Chat' }}
    </button>

    <!-- Área de chat -->
    <div *ngIf="isChatOpen" class="flex flex-col bg-blue-50 p-6 overflow-hidden">
      <h2 class="text-lg font-semibold mb-4 text-gray-800">Chat</h2>
      <div class="flex-1 overflow-auto max-h-60 space-y-4">
        <div *ngFor="let msg of messages; let i = index" 
             class="flex items-end" 
             [ngClass]="{'justify-end': i % 2 === 1, 'justify-start': i % 2 === 0}">
          <div class="max-w-xs rounded-lg p-3 text-sm shadow-lg"
               [ngClass]="{'bg-blue-600 text-white': i % 2 === 1, 'bg-gray-300 text-gray-800': i % 2 === 0}">
            <p class="text-xs font-semibold mb-1" *ngIf="msg.sender !== 'Yo'">{{ msg.sender }}</p>
            <p>{{ msg.message }}</p>
          </div>
        </div>
      </div>

      <!-- Entrada de mensaje -->
      <div class="p-4 border-t border-black">
        <form (submit)="sendMessage()">
          <div class="flex items-center">
            <input
              [(ngModel)]="newMessage"
              name="message" 
              type="text"
              placeholder="Escribe un mensaje..."
              class="flex-1 bg-gray-200 p-2 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 transition duration-200"
            />
            <button type="submit" class="ml-4 bg-blue-600 hover:bg-blue-700 text-white rounded-lg p-2 shadow-md transition duration-200">
              Enviar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Panel lateral con lista de usuarios -->
  <div class="w-full lg:w-1/4 bg-white rounded-lg shadow-md p-4 overflow-auto lg:ml-4 border border-black">
    <h2 class="text-lg font-semibold text-gray-800 mb-4">Usuarios en Línea</h2>
    <h3 class="text-sm font-semibold text-gray-700 mb-2">
      Usuario logueado: <span class="font-bold">{{ userId }} - {{ userName }}</span>
    </h3>
    <ul>
      <li *ngFor="let user of filteredUsers" 
          (click)="selectUser(user)" 
          class="p-2 rounded-lg hover:bg-blue-200 cursor-pointer text-gray-800 mb-2 transition-colors duration-200 ease-in-out">
        {{ user.name }} (ID: {{ user.id }})
      </li>
    </ul>
  </div>
</div>
