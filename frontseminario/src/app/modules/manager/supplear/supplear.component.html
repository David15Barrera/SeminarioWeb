<div class="max-w-4xl mx-auto p-6 bg-white shadow-md rounded-lg">
    <h2 class="text-2xl font-semibold text-gray-800 mb-6">Gestión de Proveedores</h2>
  
    <button (click)="openAddModal()" class="mb-4 bg-green-500 text-white py-2 px-4 rounded-lg">Agregar Proveedor</button>
  
    <table class="min-w-full border-collapse border border-gray-200">
      <thead>
        <tr class="bg-gray-100">
          <th class="border border-gray-200 px-4 py-2 text-left">Nombre</th>
          <th class="border border-gray-200 px-4 py-2 text-left">Descripción</th>
          <th class="border border-gray-200 px-4 py-2 text-left">Dirección</th>
          <th class="border border-gray-200 px-4 py-2 text-left">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let supplier of suppliers" class="border-b">
          <td class="border border-gray-200 px-4 py-2">{{ supplier.name }}</td>
          <td class="border border-gray-200 px-4 py-2">{{ supplier.description }}</td>
          <td class="border border-gray-200 px-4 py-2">{{ supplier.address }}</td>
          <td class="border border-gray-200 px-4 py-2">
            <button (click)="openEditModal(supplier)" class="text-blue-500 hover:underline">Editar</button>
            <button (click)="deleteSupplier(supplier.id)" class="text-red-500 hover:underline ml-2">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  
    <!-- Modal para Agregar/Editar Proveedor -->
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" *ngIf="isModalOpen">
      <div class="flex items-center justify-center min-h-screen">
        <div class="bg-white rounded-lg p-6 w-96">
          <h3 class="text-lg font-semibold mb-4">{{ selectedSupplier ? 'Editar' : 'Agregar' }} Proveedor</h3>
          <input [(ngModel)]="supplierData.name" placeholder="Nombre" class="border border-gray-300 rounded-lg w-full mb-4 p-2" />
          <input [(ngModel)]="supplierData.description" placeholder="Descripción" class="border border-gray-300 rounded-lg w-full mb-4 p-2" />
          <input [(ngModel)]="supplierData.address" placeholder="Dirección" class="border border-gray-300 rounded-lg w-full mb-4 p-2" />
          <div class="flex justify-end">
            <button (click)="saveSupplier()" class="bg-blue-500 text-white py-2 px-4 rounded-lg mr-2">Guardar</button>
            <button (click)="closeModal()" class="bg-red-500 text-white py-2 px-4 rounded-lg">Cancelar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
