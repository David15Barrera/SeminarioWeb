<div class="max-w-3xl mx-auto p-6 bg-white shadow-md rounded-lg">
    <h2 class="text-2xl font-semibold text-gray-800 mb-6">Configuración de Cuenta</h2>
  
    <form (ngSubmit)="updateAccount()" class="space-y-6">
      <!-- Campo de Nombre -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Nombre</label>
        <input
          [(ngModel)]="user.name"
          name="name"
          type="text"
          required
          class="mt-1 p-2 w-full border rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Nombre Completo"
        />
      </div>
  
      <!-- Campo de Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
        <input
          [(ngModel)]="user.email"
          name="email"
          type="email"
          readonly
          class="mt-1 p-2 w-full border rounded-lg outline-none bg-gray-100 text-gray-500 cursor-not-allowed"
          placeholder="correo@ejemplo.com"
        />
      </div>
  
      <!-- Campo de Dirección -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Dirección</label>
        <input
          [(ngModel)]="user.address"
          name="address"
          type="text"
          class="mt-1 p-2 w-full border rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Dirección"
        />
      </div>
  
      <!-- Campo de NIT -->
      <div>
        <label class="block text-sm font-medium text-gray-700">NIT</label>
        <input
          [(ngModel)]="user.nit"
          name="nit"
          type="text"
          required
          class="mt-1 p-2 w-full border rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="NIT"
        />
      </div>
  
      <!-- Método de Pago -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Método de Pago</label>
        <select
          [(ngModel)]="user.payment_method"
          name="payment_method"
          class="mt-1 p-2 w-full border rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="PAYPAL">PayPal</option>
          <option value="PAYMENT_GATEWAY">Payment Gateway</option>
        </select>
      </div>
  
      <!-- Campo de Contraseña -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Nueva Contraseña</label>
        <div class="relative">
          <input
            [(ngModel)]="user.password"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            class="mt-1 p-2 w-full border rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Nueva Contraseña"
          />
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-600"
          >
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path d="M2.5 10a7.5 7.5 0 0115 0 7.5 7.5 0 01-15 0zm7.5-3a3 3 0 100 6 3 3 0 000-6z" />
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path d="M10 5a7 7 0 017 7 7 7 0 01-7 7 7 7 0 01-7-7 7 7 0 017-7z" />
              <path d="M9 9a2 2 0 114 0 2 2 0 01-4 0z" />
            </svg>
          </button>
        </div>
      </div>
  
      <!-- Campo de Confirmación de Contraseña -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Confirmar Contraseña</label>
        <div class="relative">
          <input
            [(ngModel)]="confirmPassword"
            [type]="showConfirmPassword ? 'text' : 'password'"
            name="confirmPassword"
            class="mt-1 p-2 w-full border rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Confirmar Contraseña"
          />
          <button
            type="button"
            (click)="toggleConfirmPasswordVisibility()"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-600"
          >
            <svg *ngIf="!showConfirmPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path d="M2.5 10a7.5 7.5 0 0115 0 7.5 7.5 0 01-15 0zm7.5-3a3 3 0 100 6 3 3 0 000-6z" />
            </svg>
            <svg *ngIf="showConfirmPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path d="M10 5a7 7 0 017 7 7 7 0 01-7 7 7 7 0 01-7-7 7 7 0 017-7z" />
              <path d="M9 9a2 2 0 114 0 2 2 0 01-4 0z" />
            </svg>
          </button>
        </div>
      </div>
  
      <!-- Botón para Actualizar -->
      <div class="text-right">
        <button
          type="submit"
          class="bg-blue-500 text-white py-2 px-4 rounded-lg shadow-md hover:bg-blue-600 transition duration-200"
        >
          Guardar Cambios
        </button>
      </div>
    </form>
  </div>
