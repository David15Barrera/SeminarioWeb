<div class="container">
    <div class="login-section">
        <h1>Reservas</h1>
        <div class="login-form">
            <h2>Login</h2>
            <form (ngSubmit)="login()" #loginForm="ngForm"> 
                <input type="email" [(ngModel)]="email" name="email" placeholder="Correo Electrónico" required>
                <input type="password" [(ngModel)]="password" name="password" placeholder="Contraseña" required>
                <button type="submit">Ingresar</button>
            </form>
            <p>¿Ya cuentas con una Cuenta? <a href="#">Registrar</a></p>
        </div>
    </div>
    <div class="welcome-section">
        <div class="welcome-message">
            <h2>Bienvenido</h2>
            <p>Compra y Compra en tu <br> lugar favorito</p>
            <br>
            <div class="calendar-icon">
                <img src="https://shutterstock.com/image-vector/cat-sitting-sad-angry-face-600nw-2431041421.jpg" alt="Icono de Reserva">
            </div>
        </div>
    </div>
</div>
