<div class="container">
    <div class="welcome-section">
      <div class="welcome-message">
        <h2>Bienvenido</h2>
        <p>Empieza y reserva en tu <br> lugar favorito</p>
        <br>
        <div class="calendar-icon">
          <img src="https://shutterstock.com/image-vector/cat-sitting-sad-angry-face-600nw-2431041421.jpg" alt="Icono de Reserva">
        </div>
      </div>
    </div>
    <div class="registro-section">
      <div class="registro-form">
        <h3>Registro</h3>
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
          <input formControlName="name" type="text" placeholder="Nombre Completo" required>
          <input formControlName="email" type="email" placeholder="Correo Electrónico" required>
          <input formControlName="address" type="text" placeholder="Dirección" required>
          <input formControlName="nit" type="number" placeholder="NIT" required>
          <input formControlName="password" type="password" placeholder="Contraseña" required>
          <input formControlName="confirmPassword" type="password" placeholder="Confirmar Contraseña" required>
          <button type="submit" [disabled]="registerForm.invalid">Registrar</button>
        </form>
        <p>¿Ya tienes Cuenta? <a href="#">Login</a></p>
      </div>
    </div> 
  </div>
  <br>
